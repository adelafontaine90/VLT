<style>
/* Outil de terrain : une colonne, gros boutons, barre de navigation basse */
:root{
  --bg:#F1F1F1; --surface:#FFFFFF; --surface2:#F7F7F7; --fg:#1A1A1A; --muted:#5C5C5C; --line:#D9D9D9;
  --accent:#2B2B2B; --accent-fg:#FFFFFF; --accent-soft:#E4E4E4; --brand:#C41E24;
  --ok:#1B7F45; --ok-soft:#D8F0E1; --nok:#B8301C; --nok-soft:#F9DED9; --na:#6B7782; --na-soft:#E4E8EC;
  --warn:#A45F00; --warn-soft:#FBEBCF;
  --p1:#B8301C; --p2:#D9732B; --p3:#C99A00; --p4:#3D8B5A;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",Arial,Helvetica,sans-serif;
  --r:10px; --hdr:#262626; --hdr-fg:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121212; --surface:#1E1E1E; --surface2:#262626; --fg:#EDEDED; --muted:#A6A6A6; --line:#353535;
  --accent:#E6E6E6; --accent-fg:#141414; --accent-soft:#333333; --brand:#E5484D;
  --ok:#43C27A; --ok-soft:#173A27; --nok:#FF7A63; --nok-soft:#47211B; --na:#93A0AC; --na-soft:#26313C;
  --warn:#F0AE45; --warn-soft:#3F2F14; --p1:#FF7A63; --p2:#F29B57; --p3:#E8C547; --p4:#5CC487; --hdr:#1A1A1A; --hdr-fg:#EDEDED; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1E1E1E; --surface2:#262626; --fg:#EDEDED; --muted:#A6A6A6; --line:#353535;
  --accent:#E6E6E6; --accent-fg:#141414; --accent-soft:#333333; --brand:#E5484D;
  --ok:#43C27A; --ok-soft:#173A27; --nok:#FF7A63; --nok-soft:#47211B; --na:#93A0AC; --na-soft:#26313C;
  --warn:#F0AE45; --warn-soft:#3F2F14; --p1:#FF7A63; --p2:#F29B57; --p3:#E8C547; --p4:#5CC487; --hdr:#1A1A1A; --hdr-fg:#EDEDED; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);color:var(--hdr-fg);border-bottom:3px solid var(--brand)}
header.top .in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
header.top h1{font-family:var(--f-display);font-size:22px;margin:0;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:13px;opacity:.85}
.hbtn{background:transparent;border:1px solid currentColor;border-radius:8px;padding:6px 10px;color:inherit;font-weight:600;font-size:14px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.hub{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;border-left-width:1px}
.hub-ic{flex:none;width:52px;height:52px;border-radius:12px;background:var(--hdr);color:var(--hdr-fg);display:flex;align-items:center;justify-content:center;border-bottom:3px solid var(--brand)}
.hub-ic svg{width:30px;height:30px}
.hub-t{display:block;font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:.01em}
.hub-s{display:block;font-size:14px;color:var(--muted)}

nav.bottom button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:600}
nav.bottom button[aria-current="page"]{color:var(--accent)}
nav.bottom svg{width:24px;height:24px}
h2{font-family:var(--f-display);font-size:20px;margin:18px 0 8px;letter-spacing:.02em;text-wrap:balance}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--nok);border-color:var(--nok)}
.btn.block{width:100%}
.btn.big{min-height:60px;font-size:18px}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}
.kpi b{display:block;font-family:var(--f-display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.alert b{color:var(--nok)}
.site{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:100%;text-align:left}
.site .nm{font-weight:600;font-size:17px}
.site .meta{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.late{background:var(--nok-soft);color:var(--nok)}
.pill.open{background:var(--accent-soft);color:var(--accent)}
.pill.closed{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.na{background:var(--na-soft);color:var(--na)}
.pill.P1{background:var(--p1);color:#fff}.pill.P2{background:var(--p2);color:#fff}.pill.P3{background:var(--p3);color:#1a1a1a}.pill.P4{background:var(--p4);color:#fff}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface2)}
textarea{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
/* Checklist */
.vbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);z-index:10;background:var(--bg);padding-block:8px;display:flex;gap:10px;align-items:center}
.prog{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px;font-weight:700;font-size:17px;cursor:pointer}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .cnt{margin-left:auto;font-size:13px;color:var(--muted);font-weight:600}
.sec>summary .chev{transition:transform .15s}
.sec[open]>summary .chev{transform:rotate(90deg)}
.item{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.item .q{font-weight:500}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:48px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:15px}
.seg button[data-v="OK"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button[data-v="NOK"][aria-pressed="true"]{background:var(--nok);border-color:var(--nok);color:#fff}
.seg button[data-v="NO"][aria-pressed="true"]{background:var(--na);border-color:var(--na);color:#fff}
.nokbox{background:var(--nok-soft);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-weight:700}
.photo-in{display:none}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600;min-height:44px}
.toggle input{width:24px;height:24px;accent-color:var(--accent)}
.gp{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.gp .chips{gap:6px}
.gp .chip{min-width:44px;padding:8px 10px}
.scale{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.scale button{min-height:54px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;line-height:1.1}
.scale button b{font-size:18px}.scale button small{font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.scale button[aria-pressed="true"] small{color:inherit}
.prio-out{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600}
.hint{font-size:13px;color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.act{display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:left;width:100%}
.act .t{font-weight:600}
.act .m{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,10,15,.55);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--surface);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:90%;text-align:center}
.score{font-family:var(--f-display);font-size:34px;font-variant-numeric:tabular-nums}
.done-hero{text-align:center;padding:18px 14px}
.done-hero .score{font-size:56px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.modlist{display:flex;flex-wrap:wrap;gap:6px}
.modlist span{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:14px}
.modlist button{width:30px;height:30px;border-radius:50%;border:0;background:transparent;font-weight:700;color:var(--muted)}
details.cfg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.cfg>summary{padding:14px;font-weight:600;cursor:pointer}
details.cfg>.in{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.logo-prev{max-width:200px;max-height:80px;background:#fff;padding:6px;border-radius:6px;border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

<script>
"use strict";
/* ===================== RÉFÉRENTIEL ===================== */
const THEMES=[
 {id:'regles',name:'Règles & culture sécurité',items:['Port des EPI','Respect des consignes','Affichage sécurité','Farde sécurité à jour','Besoins en EPI couverts']},
 {id:'circulation',name:'Circulation & coactivité',items:['Circulation des engins','Séparation piétons / engins','Signalisation / marquage au sol','Visibilité (miroirs, éclairage)']},
 {id:'prod',name:'Produits dangereux & rétention',items:['Produits sur bacs de rétention','Étiquetage des contenants','Quantités stockées limitées','Fuites / déversements','Kit absorbant disponible']},
 {id:'stockage',name:'Stockage & manutention',items:['Stabilité des tas et des stocks','Poutrelles, tôles, jantes stockées en sécurité','Bouteilles de gaz debout et attachées','Allées et accès dégagés']},
 {id:'incendie',name:'Incendie',items:["Accessibilité des moyens d'extinction",'Présence et répartition','État et contrôle à jour','Signalisation','Bornes et RIA dégagés']},
 {id:'secours',name:'Premiers secours',items:['Boîte de secours complète','DEA accessible et contrôlé','Secouriste identifié',"Affichage des numéros d'urgence",'Registre des premiers soins']},
 {id:'elec',name:'Électricité',items:['Armoires et coffrets fermés','Câbles et rallonges en bon état','Prises et interrupteurs en bon état']},
 {id:'equip',name:'Équipements de travail & levage',items:['Échelles et escabeaux en bon état','Élingues, chaînes, accessoires contrôlés','Accès et garde-corps sécurisés','Engins et grues : état général']},
 {id:'batiment',name:'Locaux sociaux & bâtiments',items:['Vestiaires','Réfectoire','Sanitaires','Sols, dalles, chambres de visite','Portes, vitres, bâtiments']},
 {id:'ordre',name:'Ordre, propreté & environnement',items:['Propreté du site','Rangement (outils, EPI, matériel)',"Déchets d'atelier gérés",'Pollution visible (sol, eau)']},
];
const MODULES={
 machine:{theme:'machines',name:'Machine',items:['Protections machine (EPC) en place',"Balisage / zone d'exclusion","Arrêt d'urgence accessible",'Accès salle des machines verrouillé','État général']},
 vhu:{theme:'vhu',name:'VHU',items:['Gestion des fluides / dépollution','Bacs de rétention','Prévention incendie','Organisation & propreté']},
 camions:{theme:'camions',name:'Camions',items:['État général','Chargement sécurisé','Déchargement sécurisé','Filets / bâches']},
};
const THEME_NAMES=Object.fromEntries(THEMES.map(t=>[t.id,t.name]));
Object.assign(THEME_NAMES,{machines:'Machines',vhu:'VHU',camions:'Camions'});
const THEME_ORDER=[...THEMES.map(t=>t.id),'machines','vhu','camions'];
const SITE_NAMES=['Bruxelles','Charleroi','Eupen','Gent','Ghlin','Liège','Namur','QDR','Stavelot'];
const G_LABELS=['Légère','Moyenne','Grave','Très grave'];
const P_LABELS=['Improbable','Possible','Probable','Très probable'];
const GRID={4:['P2','P1','P1','P1'],3:['P3','P2','P1','P1'],2:['P4','P3','P2','P2'],1:['P4','P4','P3','P3']};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function today(){const d=new Date();return iso(d)}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function addMonths(s,n){const d=parse(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)}
function fmt(s){if(!s)return '';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/86400000)}
function prioOf(g,p){return (g&&p)?GRID[g][p-1]:null}
function dueOf(created,prio){const i=PRIO_INFO[prio];if(!i)return null;return i.days?addDays(created,i.days):addMonths(created,i.months)}
function situation(a){if(a.status==='Clôturée')return 'Clôturée';if(a.due&&a.due<today())return 'En retard';return 'Ouverte'}
function sitPill(a){const s=situation(a);return `<span class="pill ${s==='Clôturée'?'closed':s==='En retard'?'late':'open'}">${s}</span>`}
function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ===================== STOCKAGE (IndexedDB, sur le téléphone) ===================== */
const mem=new Map();let dbp=null;
function idb(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('visites-securite',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}
async function kvGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return mem.get(k)}}
async function kvSet(k,v){mem.set(k,v);try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}
async function kvDel(k){mem.delete(k);try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}

function defaultState(){return{
  v:1,settings:{author:'Arnaud Delafontaine',role:'Référent prévention & Sécurité',company:'Derichebourg Belgium',logo:null,alertDays:45,nextNum:1},
  sites:SITE_NAMES.map(n=>({id:n,name:n,resp:'',diffusion:'',modules:[]})),
  responsables:[],visits:[],actions:[],visitHistory:[],draftId:null}}
let state=defaultState();
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>kvSet('state',JSON.parse(JSON.stringify(state))),250)}
function normalize(s){const d=defaultState();const o=Object.assign(d,s||{});o.settings=Object.assign(defaultState().settings,o.settings||{});
  o.sites=(o.sites&&o.sites.length?o.sites:d.sites).map(x=>Object.assign({resp:'',diffusion:'',modules:[]},x));
  ['responsables','visits','actions','visitHistory'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});
  const mx=o.actions.reduce((m,a)=>Math.max(m,a.num||0),0);o.settings.nextNum=Math.max(o.settings.nextNum||1,mx+1);
  if(o.draftId&&!o.visits.find(v=>v.id===o.draftId&&v.status==='draft'))o.draftId=null;return o}
const site=id=>state.sites.find(s=>s.id===id)||{id,name:id,modules:[]};

/* ===================== CALCULS ===================== */
function sectionsFor(siteId){const s=site(siteId);
  return [...THEMES.map(t=>({key:t.id,name:t.name,theme:t.id,items:t.items})),
    ...(s.modules||[]).map(m=>({key:m.key,name:m.label,theme:MODULES[m.type].theme,items:MODULES[m.type].items}))]}
function itemsOf(v){const out=[];for(const sec of sectionsFor(v.site)){sec.items.forEach((lab,i)=>out.push({sec,key:sec.key+'|'+i,label:lab}));
  (v.extras||[]).filter(x=>x.sec===sec.key).forEach(x=>out.push({sec,key:'x|'+x.id,label:x.label,extra:true}))}return out}
function visitStats(v){let ok=0,nok=0,no=0,tot=0;for(const it of itemsOf(v)){tot++;const a=v.answers[it.key];if(!a)continue;if(a.v==='OK')ok++;else if(a.v==='NOK')nok++;else if(a.v==='NO')no++}
  return{ok,nok,no,tot,done:ok+nok+no,score:(ok+nok)?Math.round(100*ok/(ok+nok)):null}}
function lastVisitDate(siteId){let best=null;for(const v of state.visits)if(v.site===siteId&&v.status==='done'&&(!best||v.date>best))best=v.date;
  for(const h of state.visitHistory)if(h.site===siteId){const d=h.month+'-01';if(!best||d>best)best=d}return best}
function lastScore(siteId,beforeId){const vs=state.visits.filter(v=>v.site===siteId&&v.status==='done'&&v.id!==beforeId).sort((a,b)=>a.date<b.date?1:-1);return vs.length?vs[0].score:null}
function siteCounts(siteId){const a=state.actions.filter(x=>x.site===siteId);return{open:a.filter(x=>situation(x)==='Ouverte').length,late:a.filter(x=>situation(x)==='En retard').length,closed:a.filter(x=>x.status==='Clôturée').length}}

/* ===================== VUES ===================== */
let view='hub', viewArg=null, openSec=null;
function go(v,arg){view=v;viewArg=arg;render();window.scrollTo(0,0)}
function setHeader(t,sub){$('#title').textContent=t;$('#subtitle').textContent=sub||''}
function render(){document.querySelectorAll('nav.bottom button').forEach(b=>b.setAttribute('aria-current',b.dataset.nav===({setup:'home',visit:'home',finish:'home',done:'home',controls:'hub'}[view]||view)?'page':'false'));
  ({hub:vHub,controls:vControls,home:vHome,setup:vSetup,visit:vVisit,finish:vFinish,done:vDone,actions:vActions,export:vExport,settings:vSettings})[view]()}

function vHub(){setHeader('Prévention & sécurité',fmt(today()));
  const acts=state.actions;const late=acts.filter(a=>situation(a)==='En retard').length,open=acts.filter(a=>situation(a)==='Ouverte').length+late;
  const draft=state.draftId&&state.visits.find(v=>v.id===state.draftId);
  const ctl=[['Moyens d\'extinction','Extincteurs, RIA, bornes'],['Boîtes de secours','Contenu, péremptions'],['Échelles','État, stabilité, identification'],['Compresseurs','État, sécurités, contrôles']];
  $('#app').innerHTML=`<div class="stack">
   ${!acts.length&&!state.visits.length?`<div class="card stack"><b>Première utilisation</b><span class="hint">Importe le fichier de reprise ou ta dernière sauvegarde Excel.</span><button class="btn primary" data-act="import">Importer des données</button></div>`:''}
   <button class="hub" data-nav="home"><span class="hub-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M8.5 12l2 2 4-4"/></svg></span><span class="grow"><span class="hub-t">Rapports de visite</span><span class="hub-s">Visites sécurité des ${state.sites.length} sites</span>
     <span class="row" style="gap:6px;margin-top:6px">${draft?`<span class="pill warn">Visite en cours : ${esc(site(draft.site).name)}</span>`:''}<span class="pill open">${open} actions ouvertes</span>${late?`<span class="pill late">${late} en retard</span>`:''}</span></span></button>
   <button class="hub" data-nav="controls"><span class="hub-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-4.5"/></svg></span><span class="grow"><span class="hub-t">Contrôles internes</span><span class="hub-s">${ctl.map(c=>c[0]).join(' · ')}</span>
     <span class="row" style="gap:6px;margin-top:6px"><span class="pill na">En préparation</span></span></span></button></div>`}
function vControls(){setHeader('Contrôles internes');
  const ctl=[['Moyens d\'extinction','Extincteurs, RIA, bornes incendie'],['Boîtes de secours','Contenu complet, dates de péremption'],['Échelles','État, stabilité, identification'],['Compresseurs','État, sécurités, contrôles']];
  $('#app').innerHTML=`<div class="stack"><div class="card hint">Ce module arrive bientôt : inventaire par site, fréquence de contrôle par type, alertes d'échéance, historique par équipement, et un NOK crée une action dans le même plan d'actions.</div>
   ${ctl.map(([t,s])=>`<div class="site" style="cursor:default"><div class="grow"><div class="nm">${t}</div><div class="meta">${s}</div><div class="meta">Fréquence : à définir</div></div><span class="pill na">Bientôt</span></div>`).join('')}
   <button class="btn" data-nav="hub">Retour à l'accueil</button></div>`}

function vHome(){setHeader('Visites sécurité',fmt(today()));
  const acts=state.actions;const open=acts.filter(a=>situation(a)==='Ouverte').length,late=acts.filter(a=>situation(a)==='En retard').length;
  const draft=state.draftId&&state.visits.find(v=>v.id===state.draftId);
  let h='';
  if(!state.actions.length&&!state.visits.length)h+=`<div class="card stack" style="margin-bottom:12px"><b>Première utilisation</b><span class="hint">Importe le fichier de reprise (tes 110 actions, tes sites et responsables) ou ta dernière sauvegarde Excel.</span><button class="btn primary" data-act="import">Importer des données</button></div>`;
  if(draft){const st=visitStats(draft);h+=`<div class="card stack" style="border-color:var(--accent)"><span class="lbl">Visite en cours</span><div class="row"><b class="grow">${esc(site(draft.site).name)} · ${fmt(draft.date)}</b><span class="hint">${st.done}/${st.tot} points</span></div><div class="row"><button class="btn primary big grow" data-act="resume">Reprendre</button><button class="btn danger big" data-act="dropdraft">Supprimer</button></div></div>`}
  h+=`<div class="kpis" style="margin-top:12px"><div class="kpi"><b>${open+late}</b><span>actions ouvertes</span></div><div class="kpi ${late?'alert':''}"><b>${late}</b><span>en retard</span></div><div class="kpi"><b>${acts.filter(a=>a.status==='Clôturée').length}</b><span>clôturées</span></div></div>`;
  h+=`<h2>Choisis un site pour démarrer une visite</h2><div class="stack">`;
  for(const s of state.sites){const lv=lastVisitDate(s.id);const d=lv?daysBetween(lv,today()):null;const c=siteCounts(s.id);const sc=lastScore(s.id);
    const alert=d!==null&&d>state.settings.alertDays;
    h+=`<button class="site" data-act="newvisit" data-site="${esc(s.id)}"><div class="grow"><div class="nm">${esc(s.name)}</div><div class="meta">${lv?(d===0?'Visitée aujourd\'hui':`Dernière visite il y a ${d} j`):'Aucune visite enregistrée'}${sc!=null?` · score ${sc} %`:''}</div></div>
      <div class="stack" style="gap:4px;align-items:flex-end">${alert?`<span class="pill warn">À visiter</span>`:''}${c.late?`<span class="pill late">${c.late} en retard</span>`:''}${c.open?`<span class="pill open">${c.open} ouverte${c.open>1?'s':''}</span>`:''}</div></button>`}
  h+=`</div>`;$('#app').innerHTML=h}

function vSetup(){const v=state.visits.find(x=>x.id===viewArg);if(!v)return go('home');setHeader('Nouvelle visite',site(v.site).name);
  $('#app').innerHTML=`<div class="stack card">
   <div class="field"><label for="f-date">Date de la visite</label><input type="date" id="f-date" value="${v.date}" data-bind="date"></div>
   <div class="field"><label for="f-objet">Objet de la visite</label><input type="text" id="f-objet" value="${esc(v.objet)}" data-bind="objet"></div>
   <div class="field"><label for="f-diff">Diffusion</label><input type="text" id="f-diff" value="${esc(v.diffusion)}" data-bind="diffusion" placeholder="ex. Laurent S. / Direction"></div>
   <div class="hint">Checklist : ${THEMES.length} thèmes communs${site(v.site).modules.length?' + '+site(v.site).modules.map(m=>esc(m.label)).join(', '):''}. Modifiable dans Réglages.</div>
   <button class="btn primary big" data-act="startchecklist">Commencer la checklist</button>
   <button class="btn danger" data-act="cancelvisit">Annuler cette visite</button></div>`}

function itemHTML(v,it){const a=v.answers[it.key]||{};const val=a.v;
  let h=`<div class="item" id="it-${cssId(it.key)}"><div class="row"><div class="q grow">${esc(it.label)}</div>${it.extra?`<button class="btn small" data-act="delextra" data-key="${esc(it.key)}" aria-label="Supprimer ce point">Supprimer</button>`:''}</div>
   <div class="seg" role="group" aria-label="${esc(it.label)}">${['OK','NOK','NO'].map(x=>`<button data-act="ans" data-key="${esc(it.key)}" data-v="${x}" aria-pressed="${val===x}">${x==='NO'?'N/O':x}</button>`).join('')}</div>`;
  if(val==='NOK'){const act=a.act||{};const pr=prioOf(act.g,act.p);const due=act.on&&pr?dueOf(v.date,pr):null;
    h+=`<div class="nokbox">
     <div class="field"><label for="c-${cssId(it.key)}">Constat</label><textarea id="c-${cssId(it.key)}" data-key="${esc(it.key)}" data-field="c" placeholder="Ce que tu as observé">${esc(a.c||'')}</textarea></div>
     <div class="thumbs">${(a.ph||[]).map(id=>`<div class="thumb"><img data-photo="${id}" alt="Photo du constat"><button data-act="delphoto" data-key="${esc(it.key)}" data-ph="${id}" aria-label="Supprimer la photo">×</button></div>`).join('')}
      <button type="button" class="btn" data-act="photo" data-src="cam" data-key="${esc(it.key)}" style="width:84px;height:84px;flex-direction:column;gap:2px;font-size:13px"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Appareil</button>
      <button type="button" class="btn" data-act="photo" data-src="gal" data-key="${esc(it.key)}" style="width:84px;height:84px;flex-direction:column;gap:2px;font-size:13px"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="8.5" r="1.5"/></svg>Galerie</button></div>
     <label class="toggle"><input type="checkbox" data-act="acton" data-key="${esc(it.key)}" ${act.on?'checked':''}> Créer une action</label>`;
    if(act.on){h+=`<div class="field"><label for="a-${cssId(it.key)}">Action à mener</label><textarea id="a-${cssId(it.key)}" data-key="${esc(it.key)}" data-field="text" placeholder="ex. Placer les fûts sur bac de rétention">${esc(act.text||'')}</textarea></div>
      <div class="field"><span class="lbl">Gravité</span><div class="scale">${[1,2,3,4].map(n=>`<button type="button" data-act="g" data-key="${esc(it.key)}" data-n="${n}" aria-pressed="${act.g===n}"><b>${n}</b><small>${G_LABELS[n-1]}</small></button>`).join('')}</div></div>
      <div class="field"><span class="lbl">Probabilité</span><div class="scale">${[1,2,3,4].map(n=>`<button type="button" data-act="p" data-key="${esc(it.key)}" data-n="${n}" aria-pressed="${act.p===n}"><b>${n}</b><small>${P_LABELS[n-1]}</small></button>`).join('')}</div></div>
      <div class="prio-out">${pr?`<span class="pill ${pr}">${PRIO_INFO[pr].label}</span><span>Échéance ${fmt(due)}</span>`:'<span class="hint">Choisis gravité et probabilité pour obtenir la priorité.</span>'}</div>
      <div class="field"><span class="lbl">Responsable</span><div class="chips">${respChips(act.resp,r=>`data-act="setresp" data-key="${esc(it.key)}" data-r="${esc(r)}"`)}</div></div>`}
    h+=`</div>`}
  return h+`</div>`}
function respOptions(sel){const list=[...new Set([...state.responsables,...(sel?[sel]:[])])].sort((a,b)=>a.localeCompare(b,'fr'));
  return `<option value="">— choisir —</option>`+list.map(r=>`<option ${r===sel?'selected':''}>${esc(r)}</option>`).join('')}
function respList(sel){return [...new Set([...state.responsables,...(sel?[sel]:[])])].sort((a,b)=>a.localeCompare(b,'fr'))}
function respChips(sel,attr){const l=respList(sel);if(!l.length)return '<span class="hint">Aucun responsable : ajoute-les dans Réglages.</span>';return l.map(r=>`<button type="button" class="chip" ${attr(r)} aria-pressed="${r===sel}">${esc(r)}</button>`).join('')}
function cssId(k){return k.replace(/[^a-zA-Z0-9]/g,'_')}

function vVisit(){const v=cur();if(!v)return go('home');const st=visitStats(v);setHeader(site(v.site).name,fmt(v.date));
  let h=`<div class="vbar"><div class="prog" aria-hidden="true"><i style="width:${Math.round(100*st.done/st.tot)}%"></i></div><span class="hint" id="vb-count">${st.done}/${st.tot}</span><span class="pill ${st.score==null?'na':st.score>=90?'closed':st.score>=75?'warn':'late'}" id="vb-score">${st.score==null?'—':st.score+' %'}</span></div><div class="stack">`;
  const items=itemsOf(v);
  for(const sec of sectionsFor(v.site)){const its=items.filter(i=>i.sec.key===sec.key);const done=its.filter(i=>v.answers[i.key]).length;const nok=its.filter(i=>v.answers[i.key]?.v==='NOK').length;
    h+=`<details class="sec" data-sec="${esc(sec.key)}" ${openSec===sec.key?'open':''}><summary><svg class="chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>${esc(sec.name)}<span class="cnt">${nok?`<span class="pill late">${nok} NOK</span> `:''}${done}/${its.length}</span></summary>`;
    h+=its.map(it=>itemHTML(v,it)).join('');
    h+=`<div class="item"><div class="row"><button class="btn small" data-act="allok" data-sec="${esc(sec.key)}">Points restants → OK</button><button class="btn small" data-act="addextra" data-sec="${esc(sec.key)}">+ Ajouter un point</button></div></div></details>`}
  h+=`</div><div class="stack" style="margin-top:16px"><button class="btn primary big" data-act="tofinish">Terminer la visite</button><button class="btn danger" data-act="dropdraft">Abandonner et supprimer cette visite</button></div>`;
  $('#app').innerHTML=h;loadThumbs()}
function cur(){return state.visits.find(x=>x.id===state.draftId)}
function refreshItem(key){const v=cur();const it=itemsOf(v).find(i=>i.key===key);const el=document.getElementById('it-'+cssId(key));if(el&&it){el.outerHTML=itemHTML(v,it);loadThumbs()}refreshBar()}
function refreshBar(){const v=cur();if(!v)return;const st=visitStats(v);const c=$('#vb-count');if(!c)return;c.textContent=st.done+'/'+st.tot;
  const s=$('#vb-score');s.textContent=st.score==null?'—':st.score+' %';s.className='pill '+(st.score==null?'na':st.score>=90?'closed':st.score>=75?'warn':'late');$('.prog i').style.width=Math.round(100*st.done/st.tot)+'%';
  document.querySelectorAll('details.sec').forEach(d=>{const key=d.dataset.sec;const its=itemsOf(v).filter(i=>i.sec.key===key);const done=its.filter(i=>v.answers[i.key]).length;const nok=its.filter(i=>v.answers[i.key]?.v==='NOK').length;d.querySelector('.cnt').innerHTML=(nok?`<span class="pill late">${nok} NOK</span> `:'')+done+'/'+its.length})}
async function loadThumbs(){for(const img of document.querySelectorAll('img[data-photo]:not([src])')){const d=await kvGet('photo:'+img.dataset.photo);if(d)img.src=d;else img.alt='Photo supprimée'}}

function vFinish(){const v=cur();if(!v)return go('home');const st=visitStats(v);setHeader('Fin de visite',site(v.site).name);
  const noks=itemsOf(v).filter(i=>v.answers[i.key]?.v==='NOK');const withAct=noks.filter(i=>v.answers[i.key].act?.on);
  const missing=withAct.filter(i=>{const a=v.answers[i.key].act;return !a.text||!a.g||!a.p||!a.resp});
  $('#app').innerHTML=`<div class="stack">
   <div class="kpis"><div class="kpi"><b>${st.score==null?'—':st.score+' %'}</b><span>conformité</span></div><div class="kpi ${st.nok?'alert':''}"><b>${st.nok}</b><span>écarts (NOK)</span></div><div class="kpi"><b>${withAct.length}</b><span>actions</span></div></div>
   ${st.tot-st.done?`<div class="card hint">${st.tot-st.done} point(s) non renseigné(s) : ils n'entrent pas dans le score.</div>`:''}
   ${missing.length?`<div class="card" style="border-color:var(--nok)"><b style="color:var(--nok)">${missing.length} action(s) incomplète(s)</b><div class="hint">Il manque le texte, la gravité, la probabilité ou le responsable :</div><ul>${missing.map(i=>`<li>${esc(i.sec.name)} · ${esc(i.label)}</li>`).join('')}</ul><button class="btn" data-act="backvisit">Retour à la checklist</button></div>`:''}
   <div class="field"><label for="f-pos">✔ Points positifs (un par ligne)</label><textarea id="f-pos" data-vfield="positives" rows="4" placeholder="ex. Très bon rangement de l'atelier">${esc((v.positives||[]).join('\n'))}</textarea></div>
   <div class="field"><label for="f-crit">! Points critiques (un par ligne)</label><textarea id="f-crit" data-vfield="critical" rows="4" placeholder="ex. Dalle très dégradée : risque d'instabilité de la grue">${esc((v.critical||[]).join('\n'))}</textarea></div>
   <button class="btn primary big" data-act="finalize" ${missing.length?'disabled':''}>Clôturer et générer le rapport</button>
   <button class="btn" data-act="backvisit">Retour à la checklist</button></div>`}

function vDone(){const v=state.visits.find(x=>x.id===viewArg);if(!v)return go('home');setHeader('Rapport prêt',site(v.site).name+' · '+fmt(v.date));
  const acts=state.actions.filter(a=>a.visitId===v.id);const hasPhotos=Object.values(v.answers).some(a=>a.ph&&a.ph.length);
  $('#app').innerHTML=`<div class="stack"><div class="card done-hero"><div class="lbl">Conformité</div><div class="score">${v.score==null?'—':v.score+' %'}</div><div class="hint">${v.stats.nok} écart(s) · ${acts.length} action(s) créée(s)</div></div>
   <div class="card stack"><b>1. Envoie le rapport et l'Excel à ton adresse du boulot</b>
    <button class="btn primary big" data-act="sendboth" data-visit="${v.id}">Envoyer rapport + Excel</button>
    <span class="hint">Choisis Gmail ou Outlook, indique ton adresse professionnelle et envoie. Au bureau : relis, transfère le rapport aux personnes concernées et remplace l'Excel de suivi.</span>
    <div class="row"><button class="btn small grow" data-act="savepdf" data-visit="${v.id}">Télécharger le PDF</button><button class="btn small grow" data-act="savexlsx">Télécharger l'Excel</button></div>
    <div class="hint" id="dl-msg"></div></div>
   ${hasPhotos?`<div class="card stack"><b>2. Libère les photos du téléphone</b><span class="hint">Une fois le PDF reçu sur ta boîte du boulot, les photos n'ont plus besoin de rester ici.</span><button class="btn danger" data-act="purge" data-visit="${v.id}">Supprimer les photos de cette visite</button></div>`:''}
   <button class="btn" data-nav="home">Retour aux sites</button></div>`;makeFiles(v.id,true,false).catch(()=>{})}

let filt={site:'',sit:'open'};
function vActions(){setHeader('Actions',state.actions.length+' au total');
  let list=state.actions.slice();if(filt.site)list=list.filter(a=>a.site===filt.site);
  if(filt.sit==='open')list=list.filter(a=>a.status!=='Clôturée');else if(filt.sit==='late')list=list.filter(a=>situation(a)==='En retard');else if(filt.sit==='closed')list=list.filter(a=>a.status==='Clôturée');

function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box" role="dialog" aria-modal="true">${html}</div>`;document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m)m.remove()});return m}
function confirmBox(msg,ok='Confirmer',danger=true){return new Promise(res=>{const m=modal(`<b>${esc(msg)}</b><div class="row"><button class="btn grow" data-c="0">Annuler</button><button class="btn ${danger?'danger':'primary'} grow" data-c="1">${esc(ok)}</button></div>`);
  m.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b){m.remove();res(b.dataset.c==='1')}})})}
function choiceBox(msg,opts){return new Promise(res=>{const m=modal(`<b>${msg}</b>${opts.map(([k,l])=>`<button class="btn danger block" data-c="${k}">${esc(l)}</button>`).join('')}<button class="btn block" data-c="">Annuler</button>`);
  m.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b){m.remove();res(b.dataset.c||null)}})})}
function askText(title,ph){return new Promise(res=>{const m=modal(`<b>${esc(title)}</b><input type="text" id="ask-in" placeholder="${esc(ph||'')}"><div class="row"><button class="btn grow" data-c="0">Annuler</button><button class="btn primary grow" data-c="1">Ajouter</button></div>`);
  setTimeout(()=>m.querySelector('#ask-in').focus(),50);m.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b){const v=m.querySelector('#ask-in').value.trim();m.remove();res(b.dataset.c==='1'&&v?v:null)}})})}
function editAction(id){const a=state.actions.find(x=>x.id===id);if(!a)return;
  const m=modal(`<div class="row"><b class="grow">Action N° ${a.num} · ${esc(site(a.site).name)}</b>${sitPill(a)}</div>
   <div class="hint">${esc(THEME_NAMES[a.theme]||'')} · créée le ${fmt(a.created)}${a.origin?' · '+esc(a.origin):''}</div>
   <div class="field"><label for="e-text">Action</label><textarea id="e-text">${esc(a.text)}</textarea></div>
   <div class="field"><span class="lbl">Responsable</span><div class="chips">${respChips(a.resp,r=>`data-er="${esc(r)}"`)}</div></div>
   <div class="field"><label for="e-due">Échéance</label><input type="date" id="e-due" value="${a.due||''}"></div>
   ${a.status==='Clôturée'?`<div class="field"><label for="e-closed">Clôturée le</label><input type="date" id="e-closed" value="${a.closed||''}"></div><button class="btn" data-e="reopen">Rouvrir l'action</button>`:`<button class="btn primary big" data-e="close">Clôturer aujourd'hui</button>`}
   <div class="row"><button class="btn grow" data-e="save">Enregistrer</button><button class="btn danger" data-e="del">Supprimer</button></div>`);
  let selResp=a.resp;
  m.addEventListener('click',async e=>{const r=e.target.closest('[data-er]');if(r){selResp=r.dataset.er;m.querySelectorAll('[data-er]').forEach(x=>x.setAttribute('aria-pressed',x===r));return}
    const b=e.target.closest('[data-e]');if(!b)return;const k=b.dataset.e;
    const upd=()=>{a.text=m.querySelector('#e-text').value.trim()||a.text;a.resp=selResp;a.due=m.querySelector('#e-due').value||a.due;const c=m.querySelector('#e-closed');if(c&&c.value)a.closed=c.value};
    if(k==='close'){upd();a.status='Clôturée';a.closed=today();toast('Action clôturée')}
    else if(k==='reopen'){upd();a.status='Ouverte';a.closed=null;toast('Action rouverte')}
    else if(k==='save'){upd();toast('Enregistré')}
    else if(k==='del'){m.remove();if(await confirmBox(`Supprimer l'action N° ${a.num} ?`,'Supprimer')){state.actions=state.actions.filter(x=>x.id!==a.id);save();render();toast('Action supprimée')}return}
    m.remove();save();render()})}

     if(ch){if(ch==='all'){const ids=new Set(vv.actionIds||[]);state.actions=state.actions.filter(a=>!ids.has(a.id))}await dropVisit(vv.id);toast('Visite supprimée');render()}break}

  else if(t.dataset.bind&&v){v[t.dataset.bind]=t.value;if(t.dataset.bind==='diffusion')site(v.site).diffusion=t.value;save()}
  else if(t.dataset.vfield&&v){v[t.dataset.vfield]=t.value.split('\n').map(x=>x.trim()).filter(Boolean);save()}

async function addPhoto(f){const v=cur();if(!f||!v||!photoKey)return;if(f.type&&!/^image\//.test(f.type)&&!/\.(jpe?g|png|webp|heic|heif)$/i.test(f.name)){toast('Choisis une photo (JPG ou PNG).');return}
  try{const data=await compress(f,1280,0.72);const id=uid();await kvSet('photo:'+id,data);const a=v.answers[photoKey]||(v.answers[photoKey]={v:'NOK'});a.ph=a.ph||[];a.ph.push(id);save();refreshItem(photoKey)}catch(err){toast("La photo n'a pas pu être lue. Réessaie.")}}

async function dropVisit(id){const v=state.visits.find(x=>x.id===id);if(!v)return;for(const a of Object.values(v.answers))for(const p of a.ph||[])await kvDel('photo:'+p);
  state.visits=state.visits.filter(x=>x.id!==id);if(state.draftId===id)state.draftId=null;save()}
async function purgePhotos(id){const v=state.visits.find(x=>x.id===id);if(!v)return;for(const a of Object.values(v.answers)){for(const p of a.ph||[])await kvDel('photo:'+p);a.ph=[]}v.photosPurged=true;save()}

function compress(file,max,q){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};img.src=url})}

function finalize(){const v=cur();if(!v)return;const st=visitStats(v);v.stats={ok:st.ok,nok:st.nok,no:st.no,tot:st.tot};v.score=st.score;v.actionIds=[];
  for(const it of itemsOf(v)){const a=v.answers[it.key];if(!a||a.v!=='NOK'||!a.act||!a.act.on)continue;const pr=prioOf(a.act.g,a.act.p);
    const ac={id:uid(),num:state.settings.nextNum++,site:v.site,created:v.date,text:a.act.text.trim(),resp:a.act.resp,g:a.act.g,p:a.act.p,prio:pr,due:dueOf(v.date,pr),closed:null,status:'Ouverte',theme:it.sec.theme,visitId:v.id,itemKey:it.key,origin:'Visite du '+fmt(v.date)};
    state.actions.push(ac);v.actionIds.push(ac.id);a.actionId=ac.id}
  v.status='done';state.draftId=null;save();go('done',v.id)}

/* ===================== IMPORT ===================== */
async function doImport(file){try{let obj;const buf=await file.arrayBuffer();const u8=new Uint8Array(buf);
  if(u8[0]===0x50&&u8[1]===0x4B){try{obj=await readBackupFromXlsx(buf)}catch(e){toast("Cet Excel n'a pas été exporté par l'appli (il ne contient pas de sauvegarde).");return}}
  else obj=JSON.parse(new TextDecoder().decode(u8));
  if(!obj||obj.format!=='visites-securite'||!obj.data)throw new Error('format');
  const has=state.actions.length||state.visits.length;
  if(has&&!await confirmBox(`Remplacer toutes les données de l'appli par celles du fichier (${obj.data.actions?.length||0} actions) ?`,'Remplacer'))return;
  state=normalize(obj.data);await kvSet('state',JSON.parse(JSON.stringify(state)));try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
  toast(`Import réussi : ${state.actions.length} actions, ${state.sites.length} sites`);go('hub')}
  catch(err){toast("Ce fichier n'est pas une sauvegarde de l'appli Visites sécurité.")}}

/* ===================== ENREGISTREMENT DES FICHIERS ===================== */
function download(name,blob){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},4000)}
async function saveFile(name,blob){const m=$('#dl-msg');try{download(name,blob);if(m)m.textContent='Téléchargé : '+name;toast('Fichier téléchargé');return true}catch(e){if(m)m.textContent="Le téléchargement n'a pas abouti.";return false}}
const ready={};
async function makeFiles(id,pdf,xlsx){const out=[];if(pdf){const v=state.visits.find(x=>x.id===id);const k='pdf:'+id;if(!ready[k])ready[k]=buildReport(v).then(b=>new File([b],`Rapport visite ${safeName(site(v.site).name)} ${v.date}.pdf`,{type:'application/pdf'}));out.push(await ready[k])}
  if(xlsx)out.push(new File([buildWorkbook()],`Suivi securite sites ${today()}.xlsx`,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));return out}
async function sendFiles(id,pdf,xlsx){const m=$('#dl-msg');if(m)m.textContent='Préparation des fichiers…';
  try{const files=await makeFiles(id,pdf,xlsx);const v=id&&state.visits.find(x=>x.id===id);
    if(navigator.canShare&&navigator.canShare({files})){try{await navigator.share({files,title:v?`Rapport de visite ${site(v.site).name} ${fmt(v.date)}`:'Suivi sécurité des sites',text:v?`Rapport de visite ${site(v.site).name} du ${fmt(v.date)} et suivi des actions.`:'Suivi sécurité des sites.'});if(m)m.textContent='Fichiers transmis.';return}
      catch(e){if(e&&e.name==='AbortError'){if(m)m.textContent='Envoi annulé.';return}}}
    files.forEach(f=>download(f.name,f));if(m)m.textContent='Partage indisponible : fichiers téléchargés, joins-les depuis Téléchargements.'}
  catch(err){console.error(err);if(m)m.textContent="Les fichiers n'ont pas pu être créés."}}
function stamp(){return today()}
function safeName(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 _-]/g,'')}
async function savePdf(id){const v=state.visits.find(x=>x.id===id);if(!v)return;const m=$('#dl-msg');if(m)m.textContent='Création du rapport…';
  try{const bytes=await buildReport(v);await saveFile(`Rapport visite ${safeName(site(v.site).name)} ${v.date}.pdf`,new Blob([bytes],{type:'application/pdf'}))}catch(err){console.error(err);if(m)m.textContent='Le rapport n\'a pas pu être créé.'}}
async function saveXlsx(){const m=$('#dl-msg');if(m)m.textContent='Création du fichier Excel…';
  try{const bytes=buildWorkbook();await saveFile(`Suivi securite sites ${stamp()}.xlsx`,new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))}catch(err){console.error(err);if(m)m.textContent='Le fichier Excel n\'a pas pu être créé.'}}

class PDF{constructor(){this.W=595.28;this.H=841.89;this.pages=[];this.imgs=[]}

 rrect(x,y,w,h,r,fill){const Y=this.H-y-h,k=0.5523*r;this.c.push(`${this.rgb(fill)} rg ${x+r} ${Y} m ${x+w-r} ${Y} l ${x+w-r+k} ${Y} ${x+w} ${Y+r-k} ${x+w} ${Y+r} c ${x+w} ${Y+h-r} l ${x+w} ${Y+h-r+k} ${x+w-r+k} ${Y+h} ${x+w-r} ${Y+h} c ${x+r} ${Y+h} l ${x+r-k} ${Y+h} ${x} ${Y+h-r+k} ${x} ${Y+h-r} c ${x} ${Y+r} l ${x} ${Y+r-k} ${x+r-k} ${Y} ${x+r} ${Y} c f`)}
 line(x1,y1,x2,y2,col,lw){this.c.push(`${this.rgb(col)} RG ${lw||0.5} w ${x1} ${this.H-y1} m ${x2} ${this.H-y2} l S`)}
 tw(s,size,bold){const w=HW[bold?'Helvetica-Bold':'Helvetica'];let t=0;for(const ch of toWin(s)){const c=ch.charCodeAt(0);t+=(c>=32&&c<256)?w[c-32]:556}return t*size/1000}
 text(s,x,y,o={}){const size=o.size||10,bold=!!o.bold;let str=toWin(s);let X=x;const sp=o.spacing||0;const w=this.tw(s,size,bold)+sp*Math.max(0,str.length-1);
  if(o.align==='right')X=x-w;else if(o.align==='center')X=x-w/2;

 wrap(s,size,bold,maxW){const out=[];for(const para of String(s||'').split(/\n/)){let line='';for(const word of para.split(/\s+/).filter(Boolean)){let w=word;

   const t=line?line+' '+w:w;if(this.tw(t,size,bold)>maxW){out.push(line);line=w}else line=t}if(line)out.push(line);else if(!para.trim()&&out.length)out.push('')}return out}
 addJpeg(bytes,w,h){this.imgs.push({bytes,w,h});return this.imgs.length}

 output(){const parts=[];let len=0;const offs=[];const enc=s=>{const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return u};

function dataUrlToJpeg(d,max){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
  const b=atob(c.toDataURL('image/jpeg',0.62).split(',')[1]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);res({bytes:u,w,h})};img.onerror=rej;img.src=d})}

async function buildReport(v){const pdf=new PDF();const W=pdf.W,M=36,CW=W-2*M;const s=site(v.site);const st=v.stats||visitStats(v);

  y+=8;

  pdf.text(v.score==null?'—':v.score+' %',M+14,y+60,{size:36,bold:true,color:scoreCol(v.score)});

  const cx=M+192,cw=(CW-192-16)/3;const pc={P1:0,P2:0,P3:0,P4:0};acts.forEach(a=>pc[a.prio]++);
  const cards=[[String((v.positives||[]).length),'points positifs',C.ok],[String(st.nok),'écarts (NOK)',st.nok?C.nok:C.ink],[String(acts.length),'actions créées',C.navy]];
  cards.forEach(([n,l,col],i)=>{const x=cx+i*(cw+8);pdf.rrect(x,y,cw,bh,6,C.soft);pdf.text(n,x+cw/2,y+48,{size:30,bold:true,color:col,align:'center'});pdf.text(l,x+cw/2,y+68,{size:9,color:C.muted,align:'center'});

    pdf.text(p+' %',M+lw+bw+8,y,{size:9.5,bold:true,color:scoreCol(p)});if(sc.nok)pdf.text(sc.nok+' NOK',M+CW,y,{size:8.5,color:C.nok,align:'right'});y+=17}

  const noks=items.filter(i=>v.answers[i.key]?.v==='NOK');
  newPage(true);heading(`Écarts constatés et plan d'actions (${noks.length})`);
  if(!noks.length){pdf.text('Aucun écart constaté lors de cette visite.',M,y,{size:10,color:C.muted});y+=20}

    else{pdf.rrect(M,top+8,42,18,4,C.soft);pdf.text('Constat',M+21,top+20,{size:7.5,bold:true,color:C.muted,align:'center'})}
    let ty=top+20;l1.forEach(l=>{pdf.text(l,tx,ty,{size:9,bold:true,color:C.muted});ty+=12});

    if(ac){ty+=6;l3.forEach(l=>{pdf.text(l,tx,ty,{size:10,bold:true,color:C.navy});ty+=13});pdf.text('Pilote : '+(ac.resp||'—')+'    Échéance : '+fmt(ac.due),tx,ty+2,{size:9,color:C.ink});}
    else pdf.text('Sans action',tx,ty+4,{size:9,color:C.muted});
    let py=top+8;for(const im of ph){const id=pdf.addJpeg(im.bytes,im.w,im.h);const r=Math.min(photoW/im.w,photoH/im.h);const w=im.w*r,h=im.h*r;pdf.image(id,M+CW-photoW+(photoW-w)/2,py,w,h);py+=photoH+6}

 D[r++]={ht:22,cells:['Site',...MONTHS,'Total'].map(H)};
 for(const s of state.sites){const row=[{v:s.name,s:X.bold}];let tot=0;for(let m=1;m<=12;m++){const key=Y+'-'+String(m).padStart(2,'0');const n=done.filter(v=>v.site===s.id&&v.date.slice(0,7)===key).length+state.visitHistory.filter(h=>h.site===s.id&&h.month===key).reduce((a,h)=>a+h.count,0);tot+=n;row.push({v:n||'',s:X.num})}row.push({v:tot,s:X.boldnum});D[r++]=row}
 const dash={name:'Tableau de bord',rows:D,cols:[34,13,14,13,13,12,12,12,13,14,10,10,10,10],selected:true,nogrid:true,tab:'2B2B2B',portrait:false};
 /* Plan d'actions */
 const PA=[{ht:30,cells:['N°','Site','Créée le','Thème','Action','Responsable','Priorité','Échéance','Situation','Clôturée le','Délai (j)','Origine'].map(H)}];
 const sorted=A.slice().sort((a,b)=>a.site===b.site?a.num-b.num:a.site.localeCompare(b.site,'fr'));
 for(const a of sorted){const sit=situation(a);PA.push([{v:a.num,s:X.num},{v:site(a.site).name,s:X.txt},a.created?{v:a.created,d:1,s:X.date}:{v:'',s:X.txt},{v:THEME_NAMES[a.theme]||'',s:X.txt},{v:a.text,s:X.txt},{v:a.resp||'',s:X.txt},{v:a.prio||'—',s:a.prio?X[a.prio]:X.num},a.due?{v:a.due,d:1,s:X.date}:{v:'',s:X.txt},{v:sit,s:sit==='Clôturée'?X.green:sit==='En retard'?X.red:X.blue},a.closed?{v:a.closed,d:1,s:X.date}:{v:'',s:X.txt},{v:a.closed&&a.created?daysBetween(a.created,a.closed):'',s:X.num},{v:a.origin||'',s:X.txt}])}
 const plan={name:"Plan d'actions",rows:PA,cols:[7,12,12,24,56,18,10,12,13,12,9,20],freeze:{row:1},filter:`A1:L${PA.length}`,tab:'C00000'};
 /* Visites */
 const VI=[{ht:30,cells:['Date','Site','Objet','Score','OK','NOK','N/O','Actions créées','Diffusion'].map(H)}];
 for(const v of done.slice().sort((a,b)=>a.date<b.date?1:-1)){const sc=v.score;VI.push([{v:v.date,d:1,s:X.date},{v:site(v.site).name,s:X.txt},{v:v.objet||'',s:X.txt},sc==null?{v:'—',s:X.num}:{v:sc/100,s:sc>=90?X.greenc:sc>=75?X.yellowc:X.redc},{v:v.stats?.ok||0,s:X.num},{v:v.stats?.nok||0,s:X.num},{v:v.stats?.no||0,s:X.num},{v:(v.actionIds||[]).length,s:X.num},{v:v.diffusion||'',s:X.txt}])}
 if(state.visitHistory.length)VI.push([],[{v:'Historique avant l\'appli (nombre de visites par mois)',s:X.sub}],...state.visitHistory.map(h=>[{v:h.month,s:X.num},{v:site(h.site).name,s:X.txt},{v:h.count+' visite(s)',s:X.txt}]));
 const vis={name:'Visites',rows:VI,cols:[12,13,26,10,7,7,7,13,40],freeze:{row:1},filter:`A1:I${1+done.length}`,tab:'7F7F7F'};
 /* Écarts */
 const EC=[{ht:30,cells:['Date','Site','Thème','Point contrôlé','Constat','Action N°'].map(H)}];
 for(const v of done)for(const it of itemsOf(v)){const a=v.answers[it.key];if(a?.v!=='NOK')continue;const ac=state.actions.find(x=>x.id===a.actionId);EC.push([{v:v.date,d:1,s:X.date},{v:site(v.site).name,s:X.txt},{v:it.sec.name,s:X.txt},{v:it.label,s:X.txt},{v:a.c||'',s:X.txt},{v:ac?ac.num:'—',s:X.num}])}
 const ec={name:'Écarts constatés',rows:EC,cols:[12,13,28,36,56,10],freeze:{row:1},filter:`A1:F${EC.length}`,tab:'7F7F7F'};
 /* Sauvegarde */
 const json=JSON.stringify({format:'visites-securite',version:1,exported:new Date().toISOString(),data:state});const SB=[[{v:"Sauvegarde de l'appli Visites sécurité – ne pas modifier"}]];for(let i=0;i<json.length;i+=30000)SB.push([{v:json.slice(i,i+30000)}]);
 const sb={name:'_sauvegarde',rows:SB,hidden:true};
 return workbookZip([dash,plan,vis,ec,sb])}

async function readBackupFromXlsx(buf){const z=await unzip(buf);const wb=await z.get('xl/workbook.xml');const rels=await z.get('xl/_rels/workbook.xml.rels');const P=new DOMParser();
 const w=P.parseFromString(wb,'application/xml');let rid=null;for(const s of w.getElementsByTagName('sheet'))if(s.getAttribute('name')==='_sauvegarde')rid=s.getAttribute('r:id')||s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
 if(!rid)throw new Error('nosheet');const R=P.parseFromString(rels,'application/xml');let target=null;for(const r of R.getElementsByTagName('Relationship'))if(r.getAttribute('Id')===rid)target=r.getAttribute('Target');
 const path=target.startsWith('/')?target.slice(1):'xl/'+target;const sx=P.parseFromString(await z.get(path),'application/xml');
 let shared=[];const ss=await z.get('xl/sharedStrings.xml');if(ss){const sd=P.parseFromString(ss,'application/xml');shared=[...sd.getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join(''))}
 const vals=[];for(const c of sx.getElementsByTagName('c')){const ref=c.getAttribute('r')||'';if(!/^A\d+$/.test(ref))continue;const rn=+ref.slice(1);if(rn<2)continue;const t=c.getAttribute('t');let val='';
   if(t==='s')val=shared[+c.getElementsByTagName('v')[0].textContent];else if(t==='inlineStr')val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');else{const vv=c.getElementsByTagName('v')[0];val=vv?vv.textContent:''}vals[rn]=val}
 return JSON.parse(vals.filter(x=>x!=null).join(''))}
